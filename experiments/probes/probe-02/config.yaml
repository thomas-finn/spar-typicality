experiment: probe-02
model: Qwen/Qwen2.5-7B
suite: rosch
# Probes are fitted on each of these datasets, separately.
train_datasets:
  - rosch_label
  - rosch_example
# Datasets that are projected onto each probe. null means all datasets in
# data/processed/<suite>/. The train datasets must be in this list.
eval_datasets: null
# An explicit layer list replaces layer_start and layer_step.
layers: [20]
# Cache file dtype. float16 caches are <dataset>.float16.npz. The analysis
# always uses float32.
activation_storage_dtype: float16
probe_types:
  - diff_means
  - ridge
diff_means_fraction: 0.3333333333333333
ridge_alpha_factors: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]
batch_size: 8
device: auto
dtype: auto
seed: 0
output_dir: outputs/experiments
